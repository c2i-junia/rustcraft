# The blocks of the game, in the order of their numbers: the first is 0, the next 1, and so on.
# Chunk files and network messages store the number, so this list is append only, like the
# enum it replaces: never reorder, insert before the end or remove a block. The engine names
# some of them (`BlockId::Stone`) and checks, as it reads this file, that each is where it
# expects it.
#
# Each block:
# - `id`: its name, in snake case. Saves written in RON store it in camel case (`OakLog`).
# - `break_steps`: the mining hits it takes by hand, one every tenth of a second, twice over;
#   leave it out for a block that cannot be broken.
# - `tools`: the kinds of tools that break it faster, and `needs_tool` when broken without the
#   first it drops nothing.
# - `drops`: what breaking it gives, each `{ item, count, chance }`; one is picked by its chance
#   among them (1 when left out). The items are the `ItemId`s of the engine.
# - `look`: "solid", "transparent", "liquid" or "decoration" (drawn as crossed planes).
# - `collision` and `outline`: "full", "none", or a box `{ center = [x, y, z], half = [x, y, z] }`
#   in the cell, from 0 to 1. The outline is what the cursor aims at. Both are "full" when left
#   out.
# - `light`: the light it gives, 0 to 15. `light_opacity`: how much it dims the light through
#   it, when not what its look gives (see `BlockId::light_opacity`).
# - `usable`: a right click uses it instead of placing against it. `replaceable`: a block placed
#   in its cell takes its place.

