[package]
name = "client"
version = "1.0.0"
edition = "2021"

[dependencies]
# system_clipboard: the text fields copy and paste through the clipboard of the system, not one of
# their own
bevy = { version = "=0.19.1", features = ["serialize", "system_clipboard"] }
# debug: the components keep their names, by which `world/rendering/shaders.rs` finds one that
# Bevy keeps private (`forget_the_sky_tables_while_off`); bevy_egui happens to turn it on too
bevy_utils = { version = "=0.19.1", features = ["debug"] }
# The accessibility roles of the widgets, which Bevy does not re-export
accesskit = "0.24"
rand = "0.8.5"
bevy_renet = "5.0"
bincode = "1.3.3"
serde = { version = "1.0", features = ["derive"] }
ron = "0.6"
shared = { path = "../shared" }
# Its default features link Bevy dynamically: a release would not start without its library
server = { path = "../server", default-features = false }
log = { version = "0.4", features = ["max_level_debug", "release_max_level_warn"] }
clap = { version = "4.5.19", features = ["derive"] }
bevy-inspector-egui = "0.37"
# Enables bevy_egui's bevy_ui feature, which draws egui above Bevy UI (bevy-inspector-egui does not).
bevy_egui = { version = "0.40", default-features = false, features = ["bevy_ui", "render"] }
egui = "0.34"
# The local time of the chat messages: std has no time zone
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# The version Bevy uses: the skins the player imports are read with it, and the tests write the
# golden screenshots of the UI with it
image = { version = "0.25", default-features = false, features = ["png"] }

[features]
default = ["dev"]
# Links Bevy dynamically to speed up debug builds. Release builds disable it with `--no-default-features`.
dev = ["bevy/dynamic_linking"]

[lints]
workspace = true

[dev-dependencies]
shared = { path = "../shared", features = ["test-helpers"] }
tempfile = "3"
serde_json = "1"
# The version Bevy uses, to time whole frames on the GPU in the benchmark of the shaders
wgpu = { version = "29", default-features = false }
# The version Bevy uses, to read and write the clipboard of the system in the tests
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
