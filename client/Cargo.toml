[package]
name = "client"
version = "0.0.0"
edition = "2021"

[dependencies]
bevy = { version = "=0.19.1", features = ["serialize"] }
# The accessibility roles of the widgets, which Bevy does not re-export
accesskit = "0.24"
rand = "0.8.5"
bevy_renet = "5.0"
bincode = "1.3.3"
serde = { version = "1.0", features = ["derive"] }
ron = "0.6"
shared = { path = "../shared" }
server = { path = "../server" }
log = { version = "0.4", features = ["max_level_debug", "release_max_level_warn"] }
clap = { version = "4.5.19", features = ["derive"] }
bevy-inspector-egui = "0.37"
# Enables bevy_egui's bevy_ui feature, which draws egui above Bevy UI (bevy-inspector-egui does not).
bevy_egui = { version = "0.40", default-features = false, features = ["bevy_ui", "render"] }
egui = "0.34"
# The local time of the chat messages: std has no time zone
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[features]
default = ["dev"]
# Links Bevy dynamically to speed up debug builds. Release builds disable it with `--no-default-features`.
dev = ["bevy/dynamic_linking"]

[lints]
workspace = true

[dev-dependencies]
shared = { path = "../shared", features = ["test-helpers"] }
# The version Bevy uses, to read and write the golden screenshots of the UI
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = "3"
