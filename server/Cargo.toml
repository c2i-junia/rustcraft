[package]
name = "server"
version = "0.0.0"
edition = "2021"

[dependencies]
shared = { path = "../shared" }
bevy_app = { version = "0.19", default-features=false }
bevy_ecs = { version = "0.19", default-features=false }
bevy = { version = "0.19", features = ["serialize"]}
bevy_renet = "5.0"
bincode = { version = "1.3.3" }
serde = { version = "1.0.210", features = ["derive"] }
rand = "0.8.5"
noise = "0.9.0"
ron = "0.6"
clap = { version = "4.5.19", features = ["derive"] }
ulid = "1.1.4"

# Define the library target
[lib]
name = "server"
path = "src/lib.rs"

# Define the binary target
[[bin]]
name = "server"
path = "src/main.rs"

[lints]
workspace = true

[dev-dependencies]
shared = { path = "../shared", features = ["test-helpers"] }
tempfile = "3"
