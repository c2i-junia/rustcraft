name: Docker Image

on:
  push:
    branches:
      - main
  # release.yml publishes the server image of a release with it
  workflow_call:
    inputs:
      version:
        description: The version of the release, as its tag
        required: true
        type: string

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Name the image tags
      run: |
        image=ghcr.io/${{ github.repository }}/rustcraft-server
        if [ -n "${{ inputs.version }}" ]; then
          echo "image_tags=${image}:${{ inputs.version }} ${image}:latest" >> $GITHUB_ENV
        else
          echo "image_tags=${image}:dev-$(echo ${GITHUB_SHA} | cut -c1-7)" >> $GITHUB_ENV
        fi

    - name: Build Docker image
      run: |
        docker build --file Dockerfile $(for tag in ${{ env.image_tags }}; do echo "--tag $tag"; done) .

    - name: Push Docker image
      run: |
        for tag in ${{ env.image_tags }}; do
          docker push "$tag"
        done
