# The hub, its database and its realm agent. Secrets are files in secrets/ (see README.md and
# secrets.example/); the agent reads realm-agent.toml (from realm-agent.example.toml). The
# worlds' network, `rustcraft-realms`, is made by hand before the first start (README.md, "Deploy").
#   docker compose up -d --build
name: rustcraft-hub

# The logs of each service: 3 files of 10 MB at most, as those of the worlds.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  db:
    image: postgres:17
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: hub
      POSTGRES_DB: hub
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d hub"]
      interval: 5s
      timeout: 5s
      retries: 12

  hub:
    build:
      context: ..
      dockerfile: hub/Dockerfile
      target: hub
    image: rustcraft-hub
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      HUB_LISTEN: 0.0.0.0:8080
      HUB_PUBLIC_URL: https://hub.rustcraft.dev
      HUB_NAME: Rustcraft
      HUB_DATABASE_URL_FILE: /run/secrets/database_url
      HUB_SIGNING_KEY_FILE: /run/secrets/signing_key
      HUB_IP_SECRET_FILE: /run/secrets/ip_secret
      HUB_TRUSTED_PROXIES: 172.30.80.1/32
      # Where players join the worlds, and where the hub probes them: the gateway of its own
      # network, which reaches the ports the worlds publish without going out and back in
      # through the public address. The agent's base_port and slots are the defaults, 25000 and 20.
      HUB_REALM_HOST: play.rustcraft.dev
      HUB_REALM_PROBE_HOST: 172.30.80.1
      HUB_MAX_RUNNING: "3"
      # The web admin, at https://hub.rustcraft.dev/admin/, built into the image
      HUB_ADMIN_DIR: /usr/share/rustcraft-hub/admin
    secrets:
      - database_url
      - signing_key
      - ip_secret
    volumes:
      - agent-socket:/run/realm-agent:ro
    # Only Caddy, on this machine, reaches the hub. Docker's proxy makes every connection come
    # from the gateway of the `default` network (below), which is therefore the trusted proxy.
    ports:
      - "127.0.0.1:${HUB_PORT:-8080}:8080"
    networks:
      - backend
      - default
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # The only service with docker.sock. It has no network: it takes the hub's requests on a Unix
  # socket in the agent-socket volume, and talks to Docker on docker.sock.
  realm-agent:
    build:
      context: ..
      dockerfile: hub/Dockerfile
      target: realm-agent
    image: rustcraft-realm-agent
    restart: unless-stopped
    logging: *logging
    configs:
      - source: realm_agent
        target: /etc/rustcraft/realm-agent.toml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - agent-socket:/run/realm-agent
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

networks:
  # A fixed subnet, so that the address of its gateway is known to HUB_TRUSTED_PROXIES.
  default:
    ipam:
      config:
        - subnet: 172.30.80.0/24
  # The database has no way out, and nothing but the hub reaches it.
  backend:
    internal: true

volumes:
  db-data:
  agent-socket:

configs:
  realm_agent:
    file: ./realm-agent.toml

secrets:
  db_password:
    file: ./secrets/db_password
  database_url:
    file: ./secrets/database_url
  signing_key:
    file: ./secrets/signing.key
  ip_secret:
    file: ./secrets/ip-secret
