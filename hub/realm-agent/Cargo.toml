[package]
name = "rustcraft-realm-agent"
version = "0.0.0"
edition = "2021"
description = "Runs the hosted worlds of the Rustcraft hub in Docker containers."

[[bin]]
name = "rustcraft-realm-agent"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bollard = "0.21"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
rustcraft-agent-protocol = { path = "../agent-protocol" }
rustcraft-protocol = { path = "../../crates/protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = "0.3"
tokio = { version = "1", features = ["full"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
