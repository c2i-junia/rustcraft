[workspace]
resolver = "2"
members = ["."]

[package]
name = "rustcraft-hub"
version = "0.0.0"
edition = "2021"
description = "The Rustcraft hub: accounts, device certificates and hosted worlds."

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core"] }
hex = "0.4"
rand = "0.8"
rustcraft-protocol = { path = "../crates/protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `macros` is on only for `sqlx::migrate!`; the queries are checked at runtime.
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "uuid", "time", "migrate", "macros"] }
time = "0.3"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
