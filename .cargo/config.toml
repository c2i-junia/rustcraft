# for Linux
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = [
    "-C", "link-arg=-fuse-ld=/usr/bin/mold",
    # (Nightly) Make the current crate share its generic instantiations
    "-Zshare-generics=y",
]

[unstable]
codegen-backend = true
feature-unification = true

# (Nightly) Resolve features over the whole workspace, so that `-p client`, `-p server`
# and the tests all share the same build of Bevy.
[resolver]
feature-unification = "workspace"

[profile.dev]
codegen-backend = "cranelift"

[profile.dev.package."*"]
codegen-backend = "llvm"