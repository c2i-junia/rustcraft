# for Linux
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = [
    "-C", "link-arg=-fuse-ld=/usr/bin/mold",
    # (Nightly) Make the current crate share its generic instantiations
    "-Zshare-generics=y",
]

[unstable]
codegen-backend = true
feature-unification = true

# (Nightly) Resolve features over the whole workspace, so that `-p client`, `-p server`
# and the tests all share the same build of Bevy.
[resolver]
feature-unification = "workspace"

[profile.dev]
codegen-backend = "cranelift"

[profile.dev.package."*"]
codegen-backend = "llvm"

# The terrain, the biomes and the caves are computed in `shared`, where the tests that generate
# worlds spend most of their time: built by Cranelift at opt-level 1, a column of terrain took
# 28 µs, and `shared`'s tests 38 s; 6 s built so. An edit of `shared` builds as fast as before:
# most of that time goes to the crates that depend on it.
[profile.dev.package.shared]
codegen-backend = "llvm"
opt-level = 3
