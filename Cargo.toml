[workspace]
resolver = "2"
exclude = ["hub"]
members = [
    "shared",
    "client",
    "server",
    "crates/protocol",
]

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
# Drop their debug info: it makes up most of the target size and is rarely needed.
[profile.dev.package."*"]
opt-level = 3
debug = false

# Release speed, rebuilt quickly: for playing and testing worldgen and meshing, where the debug
# profile is too slow. Measured: a rebuild after an edit takes 21-52 s (release: 72-188 s).
# Run it with `just play`.
[profile.play]
inherits = "release"
incremental = true
codegen-units = 256

[workspace.lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"
