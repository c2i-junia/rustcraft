[package]
name = "shared"
version = "0.0.0"
edition = "2021"

[dependencies]
bevy_log = { version = "0.19", default-features=false }
bevy_ecs = { version = "0.19", default-features=false}
log = { version = "0.4", features = ["max_level_debug", "release_max_level_warn"] }
serde = { version = "1.0.210", features = ["derive"] }
bevy = { version = "0.19", default-features = false, features = ["serialize"] }
rand = "0.8"
bevy_renet = "5.0"
bincode = "1.3.3"
lz4 = "1.28.1"
bevy_platform = "0.19"
noise = "0.9.0"
socket2 = "0.6"
toml = { version = "0.8", default-features = false, features = ["parse"] }
semver = { version = "1", features = ["serde"] }
ron = "0.6"

[dev-dependencies]
tempfile = "3"

[features]
# Fixtures to build worlds in the tests of the crates that depend on this one.
test-helpers = []

[lints]
workspace = true
